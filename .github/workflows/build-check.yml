name: Build check

# Builds the mod and the free plugin without releasing anything, and asserts the
# public API classes really are inside both jars.
#
# That last check matters: consumers compile against com.pmchat.api from Maven
# Central with `compileOnly`, so if the classes ever stop being packed into the
# shipped jars, every dependent plugin and mod dies at runtime with
# NoClassDefFoundError — and nothing else in CI would notice.

on:
  push:
    branches-ignore:
      - 'gh-pages'
    paths:
      - 'src/**'
      - 'api-mod/**'
      - 'server-plugin/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Set up Gradle for the server plugin
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build server plugin (free edition only)
        working-directory: server-plugin
        run: gradle build --no-daemon --stacktrace

      - name: Assert the API ships inside both jars
        run: |
          set -euo pipefail

          check() {
            local jar="$1" prefix="$2"
            echo "::group::$jar"
            if [ ! -e "$jar" ]; then
              echo "::error::jar not found: $jar"
              exit 1
            fi
            local found
            found=$(unzip -l "$jar" | grep -c "$prefix" || true)
            unzip -l "$jar" | grep "$prefix" || true
            echo "::endgroup::"
            if [ "$found" -eq 0 ]; then
              echo "::error::$jar does not contain $prefix — API consumers would hit NoClassDefFoundError"
              exit 1
            fi
            echo "$jar: $found entries under $prefix"
          }

          mod=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)
          plugin=$(find server-plugin/build/libs -maxdepth 1 -name 'PocketChat-*.jar' | head -n1)

          check "$mod" 'com/pmchat/api/client/'
          check "$plugin" 'com/pmchat/api/'

      - uses: actions/upload-artifact@v4
        with:
          name: pmchat-jars
          path: |
            build/libs/*.jar
            server-plugin/build/libs/*.jar
          if-no-files-found: error
