name: Build check

# Builds the mod without releasing anything, and asserts the public client API
# classes really are inside the jar.
#
# That check matters: consumers compile against com.pmchat.api.client from Maven
# Central with `compileOnly`, so if the classes ever stop being packed into the
# shipped jar, every dependent mod dies at runtime with NoClassDefFoundError —
# and nothing else in CI would notice.

on:
  push:
    branches-ignore:
      - 'gh-pages'
    paths:
      - 'src/**'
      - 'api-mod/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Assert the API ships inside the jar
        run: |
          set -euo pipefail

          check() {
            local jar="$1" prefix="$2"
            echo "::group::$jar"
            if [ ! -e "$jar" ]; then
              echo "::error::jar not found: $jar"
              exit 1
            fi
            local found
            found=$(unzip -l "$jar" | grep -c "$prefix" || true)
            unzip -l "$jar" | grep "$prefix" || true
            echo "::endgroup::"
            if [ "$found" -eq 0 ]; then
              echo "::error::$jar does not contain $prefix — API consumers would hit NoClassDefFoundError"
              exit 1
            fi
            echo "$jar: $found entries under $prefix"
          }

          mod=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)

          check "$mod" 'com/pmchat/api/client/'

      - uses: actions/upload-artifact@v4
        with:
          name: pmchat-jars
          path: |
            build/libs/*.jar
          if-no-files-found: error
