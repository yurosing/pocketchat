name: Build and release (public)

# Builds the client mod and publishes a GitHub release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Locate mod jar
        id: jar
        run: |
          jar=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmchat-jars
          path: |
            ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
            echo "name=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract current version's release notes
        run: |
          awk '/^## PocketChat/{if(++n==2) exit} {print}' RELEASE_NOTES.md > CURRENT_RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: CURRENT_RELEASE_NOTES.md
          files: |
            ${{ steps.jar.outputs.path }}
