org.gradle.jvmargs=-Xmx1G
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

minecraft_version=26.2
# Minecraft 26.1+ ships unobfuscated with official Mojang mappings; Fabric stopped
# maintaining Yarn from that point on. No yarn_mappings property anymore — see
# build.gradle's `mappings` line, which uses loom.officialMojangMappings().
loader_version=0.19.0
fabric_version=0.158.0+26.2

mod_version=26.2.0
maven_group=com.pmchat
archives_base_name=pmchat-mod

# Version of the published API artifacts (io.github.yurosing:pocketchat-api-*).
# Independent of mod_version: the mod can move without breaking API consumers.
api_version=1.0.0

# Minecraft 26.1+ requires Java 25 for both the Gradle JVM and the mod's own toolchain.
java_version=25
