org.gradle.jvmargs=-Xmx1G
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

minecraft_version=26.2
# Minecraft 26.1+ ships fully unobfuscated (real names baked into the jar) — Mojang
# doesn't even publish a mappings file for these versions, so there's no
# yarn_mappings property and no `mappings` line in build.gradle at all anymore.
loader_version=0.19.3
fabric_version=0.158.0+26.2

mod_version=26.2.3
maven_group=com.pmchat
archives_base_name=pmchat-mod

# Version of the published API artifacts (io.github.yurosing:pocketchat-api-*).
# Independent of mod_version: the mod can move without breaking API consumers.
api_version=1.0.0

# Minecraft 26.1+ requires Java 25 for both the Gradle JVM and the mod's own toolchain.
java_version=25
