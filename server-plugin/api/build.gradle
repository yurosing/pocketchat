plugins {
    id 'java'
    id 'com.vanniktech.maven.publish'
}

group = 'io.github.yurosing'
version = rootProject.ext.apiVersion

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Bukkit/Paper types leak into the API (Player, Event, OfflinePlayer), but only
    // as compileOnly — compileOnly dependencies never reach the published POM, so the
    // artifact on Maven Central has no dependency on a non-Central repository.
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

mavenPublishing {
    // automaticRelease: the deployment goes live without anyone clicking "Publish"
    // in the Central Portal UI.
    publishToMavenCentral(true)
    signAllPublications()

    coordinates(group.toString(), 'pocketchat-api-plugin', version.toString())

    pom {
        name = 'PocketChat Plugin API'
        description = 'Server-side API for the PocketChat Paper plugin: events, gift registry, media store and the pmchat:media wire protocol.'
        url = 'https://github.com/yurosing/pocketchat'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/yurosing/pocketchat/blob/main/LICENSE'
            }
        }
        developers {
            developer {
                id = 'yurosing'
                name = 'yurosing'
                url = 'https://github.com/yurosing'
            }
        }
        scm {
            url = 'https://github.com/yurosing/pocketchat'
            connection = 'scm:git:https://github.com/yurosing/pocketchat.git'
            developerConnection = 'scm:git:ssh://git@github.com/yurosing/pocketchat.git'
        }
    }
}
