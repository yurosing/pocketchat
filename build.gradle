plugins {
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
    // Version declared once here; :api-mod applies it and does the actual publishing.
    id 'com.vanniktech.maven.publish' version '0.30.0' apply false
}

version = project.mod_version
group = project.maven_group

// `jar` below reads :api-mod's sourceSets at configuration time, which only works once
// that project has been evaluated.
evaluationDependsOn(':api-mod')

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    // Mod Menu from Modrinth's maven (reliable). maven.terraformersmc.com has been
    // flaky and even 404'd the artifact outright, so we resolve it from Modrinth.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.terraformersmc.com/releases' } // fallback
    mavenCentral()
}

dependencies {
    // The public client API — compiled into the mod jar (see the `jar` block below) so
    // other mods find com.pmchat.api.client at runtime.
    implementation project(':api-mod')

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1+ ships unobfuscated with official Mojang mappings; Fabric no longer
    // maintains Yarn from this version on.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu — только API на компиляции, для экрана настроек (с Modrinth-мавена)
    modCompileOnly "maven.modrinth:modmenu:17.0.0-beta.2"

    // Vosk — оффлайн-распознавание речи (нативная библиотека внутри jar;
    // JNA не включаем — Minecraft уже поставляет её для Narrator)
    implementation 'com.alphacephei:vosk:0.3.45'
    include 'com.alphacephei:vosk:0.3.45'

    implementation 'com.google.code.gson:gson:2.10.1'
    include 'com.google.code.gson:gson:2.10.1'

    // JCodec — чистый Java-декодер H.264/MP4 (без нативных бинарников):
    // инлайн-превью видео кадрами прямо в игре.
    implementation 'org.jcodec:jcodec:0.2.5'
    include 'org.jcodec:jcodec:0.2.5'
    implementation 'org.jcodec:jcodec-javase:0.2.5'
    include 'org.jcodec:jcodec-javase:0.2.5'

    // NEW (4.3): встроенный видеоплеер (пауза/громкость/скорость) через VLC.
    // Требует установленный VLC media player у игрока — сами бинарники VLC
    // НЕ включаем, только Java-обвязку, которая находит и дёргает системный VLC.
    implementation 'uk.co.caprica:vlcj:4.8.2'
    include 'uk.co.caprica:vlcj:4.8.2'
    // vlcj-natives — сами JNA-биндинги (LibVlc, RuntimeUtil и т.д.), без неё
    // vlcj падает с NoClassDefFoundError. Gradle резолвит её транзитивно для
    // компиляции, но Loom не пакует транзитивные зависимости сам — нужно
    // явно перечислить, иначе в итоговом jar её просто не будет.
    implementation 'uk.co.caprica:vlcj-natives:4.8.1'
    include 'uk.co.caprica:vlcj-natives:4.8.1'
    implementation 'net.java.dev.jna:jna:5.13.0'
    include 'net.java.dev.jna:jna:5.13.0'
    implementation 'net.java.dev.jna:jna-platform:5.13.0'
    include 'net.java.dev.jna:jna-platform:5.13.0'
}

// Pack the API classes into the mod jar, unrelocated: other mods compile against
// com.pmchat.api.client from Maven Central and must find that exact package at runtime.
jar {
    dependsOn ':api-mod:classes'
    from project(':api-mod').sourceSets.main.output
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = project.java_version as int

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
